<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Red Hands — the slap-or-dodge reaction game. Combos, fatalities, two players on one phone.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#22125e">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Red Hands">
<title>Red Hands</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;font-family:ui-rounded,-apple-system,system-ui,'Segoe UI',Roboto,sans-serif!important;height:100%;overflow:hidden;background:#3a2a9a;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:ui-rounded,-apple-system,system-ui,sans-serif;color:#fff}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5;transition:opacity .25s}
.ov.hide{opacity:0;pointer-events:none;visibility:hidden}
.dim{background:rgba(24,12,70,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#menu{background:rgba(24,12,70,.38);flex-direction:column;justify-content:space-between;padding:14px 16px 16px}
.card{width:min(380px,100%);text-align:center}
.logo{font-weight:900;font-size:clamp(44px,13vw,68px);line-height:.92;letter-spacing:-1px;text-shadow:0 4px 0 #24125e,0 8px 24px rgba(0,0,0,.35);margin:0 0 4px}
.logo span{display:inline-block;color:#ff4d6d;text-shadow:0 4px 0 #7a0f2a,0 8px 24px rgba(255,40,80,.45);transform:rotate(-3deg)}
.sub{margin:4px 0 16px;font-weight:500;opacity:.9;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:18px;padding:15px 16px;margin:9px 0;font:700 18px ui-rounded,-apple-system,system-ui,sans-serif;color:#fff;cursor:pointer;position:relative;transition:transform .08s}
.btn:active{transform:translateY(3px)}
.btn:disabled{cursor:default}
.b1{background:linear-gradient(#4f8cff,#2f63e0);box-shadow:0 5px 0 #1d3f9e,0 10px 20px rgba(0,0,0,.25)}
.b2{background:linear-gradient(#ff5f7e,#e33358);box-shadow:0 5px 0 #9a1a37,0 10px 20px rgba(0,0,0,.25)}
.b3{background:linear-gradient(#8a80c8,#6c63ad);box-shadow:0 5px 0 #463f80;opacity:.75}
.bg{background:linear-gradient(#45e39a,#22b56e);box-shadow:0 5px 0 #157346,0 10px 20px rgba(0,0,0,.2)}
.by{background:linear-gradient(#ffdc5c,#f5b921);color:#3a2a00;box-shadow:0 5px 0 #a07818}
.bw{background:#fff;color:#3b2a9c;box-shadow:0 5px 0 #b9b2ea}
.btn small{font-size:12px;background:#ffd23f;color:#3a2a00;padding:2px 8px;border-radius:99px}
.btn.sm{padding:11px 12px;font-size:16px;margin:6px 0;border-radius:14px}
.seg{display:flex;gap:6px;background:rgba(0,0,0,.22);padding:5px;border-radius:14px;margin:6px 0}
.seg button{flex:1;border:0;border-radius:10px;padding:9px 4px;font:700 15px ui-rounded,-apple-system,system-ui,sans-serif;color:#d9d4ff;background:transparent;cursor:pointer}
.seg button.on{background:#fff;color:#3b2a9c}
.lbl{font-size:13px;opacity:.75;margin-top:10px}
.topbar{width:min(460px,100%);display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.18);border-radius:99px;padding:5px 12px 5px 6px;color:#fff;font:700 15px ui-rounded,-apple-system,system-ui,sans-serif;cursor:pointer;min-width:0}
.chip .lv{flex:none;width:30px;height:30px;border-radius:50%;background:linear-gradient(#ffdc5c,#f5a921);color:#3a2a00;display:grid;place-items:center;font-weight:900;font-size:14px;box-shadow:0 2px 0 #a07818}
.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.xpb{display:block;width:60px;height:7px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden;flex:none}
.xpb i{display:block;height:100%;background:#3ee08f;border-radius:9px;width:0}
.coin{padding:6px 14px;cursor:default}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(0,0,0,.22);border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:700;font-size:15px;cursor:pointer;border:0;color:#fff;width:100%}
.toggle .sw{width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.25);position:relative;flex:none;transition:.2s}
.toggle .sw:after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on .sw{background:#3ee08f}.toggle.on .sw:after{inset-inline-start:23px}
.toggle.locked{opacity:.7}
.toggle .req{font-size:12px;font-weight:500;opacity:.85}
.bnav{width:min(460px,100%);display:flex;justify-content:space-around;gap:6px}
.bnav button{flex:1;border:0;background:rgba(0,0,0,.28);border-radius:16px;padding:8px 2px 7px;color:#fff;font:600 12px ui-rounded,-apple-system,system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.bnav button b{font-size:21px;line-height:1.1}
.bnav button{font-size:11px!important}
.combos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cb{border-radius:14px;padding:10px 4px;text-align:center;color:#fff;font-weight:900}
.cb b{display:block;font-size:22px}
.cb span{font-size:12px}
.ach .st{margin-inline-start:auto;font-size:12px;font-weight:800;white-space:nowrap;color:#22a362}
.ach .st.lk{color:#8a84b0}
.nextbox{background:linear-gradient(135deg,#3b2a9c,#6a4cff);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px}
.nextbox .bar{height:9px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-top:8px}.nextbox .bar i{display:block;height:100%;background:#ffd23f}
.bnav .dot{position:absolute}
/* sheets */
.sheet{width:min(460px,100%);max-height:100%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;background:#fff;color:#2a1d6e;border-radius:24px;padding:16px 16px 20px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:start}
.sheet h2{margin:0;font-weight:900;font-size:24px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;position:sticky;top:-16px;background:#fff;padding:6px 0;z-index:2}
.x{border:0;background:#efecff;color:#3b2a9c;width:38px;height:38px;border-radius:50%;font:900 18px system-ui;cursor:pointer;flex:none}
.coinpill{background:#fff4c9;color:#7a5800;border-radius:99px;padding:6px 12px;font-weight:800}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -4px 8px;scrollbar-width:none;touch-action:pan-x}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:#efecff;color:#3b2a9c;border-radius:12px;padding:8px 11px;font:700 14px ui-rounded,-apple-system,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#3b2a9c;color:#fff}
#pv{width:100%;height:200px;border-radius:18px;display:block;background:#6252e6;touch-action:pan-y}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-top:10px}
.it{border:2px solid #e6e2ff;background:#faf9ff;border-radius:16px;padding:8px 6px;text-align:center;cursor:pointer;position:relative;color:#2a1d6e;font:inherit}
.it.sel{border-color:#3b2a9c;box-shadow:0 0 0 3px rgba(59,42,156,.18)}
.it .sw{width:44px;height:44px;border-radius:12px;margin:2px auto 6px;display:grid;place-items:center;font-size:26px;border:2px solid rgba(0,0,0,.08)}
.it .nm{font-weight:700;font-size:13px;line-height:1.15;min-height:30px}
.it .pr{font-size:12px;font-weight:800;margin-top:4px;color:#a07818}
.it .pr.own{color:#22a362}.it .pr.eq{color:#fff;background:#3b2a9c;border-radius:99px;padding:1px 6px;display:inline-block}
.it .pr.lock{color:#8a84b0}
.buybar{position:sticky;bottom:-20px;background:#fff;padding:10px 0 4px;margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:#f4f2ff;border-radius:16px;padding:10px 12px}
.tile .v{font-weight:900;font-size:22px;color:#3b2a9c}
.tile .k{font-size:12.5px;opacity:.8}
.tile.big{grid-column:span 2;background:linear-gradient(135deg,#3b2a9c,#6a4cff);color:#fff}
.tile.big .v{color:#ffd23f;font-size:30px}
.achs{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.ach{display:flex;gap:10px;align-items:center;background:#f4f2ff;border-radius:14px;padding:8px 10px}
.ach .ic{font-size:26px;width:40px;height:40px;display:grid;place-items:center;background:#fff;border-radius:12px;flex:none}
.ach.lock{opacity:.55;filter:grayscale(1)}
.ach b{display:block;font-size:14.5px}.ach span{font-size:12.5px;opacity:.8}
.sec{font-weight:900;font-size:17px;margin:16px 0 6px}
.lbrow{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid #eee}
.lbrow .rk{width:28px;text-align:center;font-weight:900}
.lbrow .n{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .s{font-weight:900;color:#3b2a9c}
.note{font-size:12.5px;opacity:.7;margin-top:10px;line-height:1.4}
.field{display:block;margin:8px 0}
.field span{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.field input{width:100%;font:600 17px ui-rounded,-apple-system,system-ui,sans-serif;padding:11px 12px;border-radius:12px;border:2px solid #e2ddff;color:#2a1d6e;outline:none;-webkit-user-select:text;user-select:text}
.field input:focus{border-color:#6a4cff}
.sheet .toggle{background:#f4f2ff;color:#2a1d6e}
.sheet .toggle .sw{background:#d8d2ff}
.sheet .seg{background:#f0edff}.sheet .seg button{color:#6a5fb0}.sheet .seg button.on{background:#3b2a9c;color:#fff}
.danger{background:none;border:0;color:#e33358;font:700 14px ui-rounded,-apple-system,system-ui,sans-serif;margin-top:14px;cursor:pointer;text-decoration:underline}
/* game over */
.win{font-weight:900;font-size:clamp(34px,10vw,50px);margin:0 0 2px;text-align:center}
.score{text-align:center;font-weight:900;font-size:22px;color:#6a5fb0;margin-bottom:8px}
.rew{display:flex;gap:8px;justify-content:center;margin:8px 0}
.rew div{background:#f4f2ff;border-radius:14px;padding:8px 14px;font-weight:900;font-size:18px}
.lvup{background:linear-gradient(135deg,#ffdc5c,#ff9f1c);color:#3a2a00;border-radius:16px;padding:10px 12px;text-align:center;font-weight:800;margin:8px 0;animation:pop .5s}
.newach{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.newach span{background:#3b2a9c;color:#fff;border-radius:99px;padding:5px 10px;font-weight:700;font-size:13px;animation:pop .5s}
#shareImg{width:100%;border-radius:16px;display:block;margin:8px 0;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.srow{display:flex;gap:8px}.srow .btn{margin:4px 0}
a.btn{text-decoration:none}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
/* in-game buttons */
.rb{position:fixed;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;z-index:4;background:rgba(255,255,255,.18);color:#fff;font:700 17px system-ui;cursor:pointer;display:none}
#exit{left:10px}#mute{right:10px}
/* tutorial banner */
.tut{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 24px));z-index:6;background:#fff;color:#2a1d6e;border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:opacity .25s}
.tut.hide{opacity:0;pointer-events:none}
.tut .st{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:#6a5fb0}
.tut .dots{display:flex;gap:5px}.tut .dots i{width:22px;height:6px;border-radius:9px;background:#e2ddff}.tut .dots i.on{background:#3b2a9c}
.tut h3{margin:6px 0 2px;font-size:19px;font-weight:900}.tut p{margin:0;font-size:14.5px;line-height:1.35}
.tut button{border:0;background:none;color:#6a5fb0;font:700 13px ui-rounded,-apple-system,system-ui,sans-serif;cursor:pointer;text-decoration:underline}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:calc(100% - 24px)}
.toast{background:#2a1d6e;color:#fff;border:2px solid #ffd23f;border-radius:16px;padding:9px 14px;font-weight:700;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pop .4s;display:flex;gap:10px;align-items:center;max-width:420px}
.toast b{font-size:24px}
.gest{display:inline-flex;gap:3px;margin-top:5px;flex-wrap:wrap;align-items:center}
.gest i{font-style:normal;background:#fff;border:2px solid #3b2a9c;border-radius:7px;min-width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px;color:#3b2a9c;font-weight:900;padding:0 4px}
.gest em{font-style:normal;font-size:12px;color:#1f8fff;margin-inline-start:6px;font-weight:900}

/* ===== app layout ===== */
:root{--tab:66px}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:space-around;background:rgba(255,255,255,.98);border-top:1px solid #e6e2ff;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(20,10,60,.18);height:calc(var(--tab) + env(safe-area-inset-bottom))}
#tabbar.hide{display:none}
.sheet .toggle.on .sw{background:#3ee08f}
#tabbar button{flex:1;border:0;background:none;color:#8a84b0;font:700 11.5px ui-rounded,-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border-radius:14px;margin:0 2px;transition:.15s}
#tabbar button b{font-size:23px;line-height:1;filter:grayscale(.7);opacity:.75;transition:.15s}
#tabbar button.on{color:#3b2a9c;background:#efecff}
#tabbar button.on b{filter:none;opacity:1;transform:translateY(-1px) scale(1.12)}
.ov.page{padding:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom));align-items:stretch;justify-content:center}
.ov.page .sheet{width:100%;max-width:560px;max-height:none;height:100%;border-radius:0;box-shadow:none;padding:12px 16px 24px}
.ov.page .shead{top:-12px;padding:10px 0 8px;margin-bottom:6px;border-bottom:1px solid #f0edff}
.ov.page .x{display:none}
#lb.page .x{display:block}
#menu.home{flex-direction:column;justify-content:flex-start;padding:12px 14px 0;background:linear-gradient(rgba(24,12,70,.55),rgba(24,12,70,.35) 40%,rgba(24,12,70,.6))}
.homeScroll{flex:1;width:100%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;display:flex;justify-content:center;padding:6px 0 18px}
.homeScroll .card{margin:auto 0}
.logo{font-size:clamp(40px,12vw,64px)}
.btn.big{padding:17px 16px;font-size:19px}
.row2{display:flex;gap:8px}.row2 .btn{flex:1;font-size:14.5px;padding:12px 8px}
.opts{background:rgba(0,0,0,.2);border-radius:18px;padding:4px 10px 10px;margin-top:10px}
.opts .toggle{background:rgba(0,0,0,.18);margin-bottom:0}
@media (max-height:640px){.logo{font-size:38px}.sub{margin:2px 0 8px}.btn.big{padding:13px}.btn{margin:6px 0}}

/* ===== v2 polish: clean "Apple" layer — glass, soft depth, springy motion ===== */
:root{--ink:#1d1640;--ink2:#6b6590;--bg2:#f5f4fa;--card:#ffffff;--line:rgba(30,20,80,.08);--spring:cubic-bezier(.34,1.56,.64,1);--glass:rgba(255,255,255,.13);--glassb:rgba(255,255,255,.24)}
body{-webkit-font-smoothing:antialiased}
.btn{border-radius:20px;letter-spacing:-.01em;transition:transform .35s var(--spring),filter .2s,box-shadow .2s}
.btn:active{transform:scale(.96) translateY(1px);filter:brightness(.97)}
.b1{background:linear-gradient(180deg,#5a95ff,#2f63e0);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #1d3f9e,0 12px 26px rgba(30,60,200,.35)}
.b2{background:linear-gradient(180deg,#ff6a86,#e33358);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #9a1a37,0 12px 26px rgba(220,40,80,.35)}
.by{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 0 #a07818,0 10px 22px rgba(200,150,20,.3)}
.bw{box-shadow:inset 0 -1px 0 rgba(0,0,0,.05),0 4px 0 #cfc9f2,0 10px 22px rgba(20,10,60,.18)}
.bg{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #157346,0 10px 22px rgba(20,160,90,.3)}
.b3{background:var(--glass);border:1px solid var(--glassb);box-shadow:none;opacity:.85;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
/* home: glass card so the live demo behind it reads as depth, not clutter */
#menu.home{background:radial-gradient(120% 70% at 50% 30%,rgba(24,12,70,.15),rgba(14,6,50,.7))}
.homeScroll .card{background:rgba(30,18,90,.32);border:1px solid rgba(255,255,255,.16);border-radius:30px;padding:22px 18px 18px;-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);box-shadow:0 30px 60px rgba(8,2,40,.35),inset 0 1px 0 rgba(255,255,255,.15);animation:rise .6s var(--spring) both}
.logo{letter-spacing:-.03em}
.opts{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08)}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.seg{background:rgba(0,0,0,.25)}
.seg button{transition:background .25s,color .25s,transform .3s var(--spring)}
.seg button.on{box-shadow:0 2px 8px rgba(0,0,0,.18)}
/* iOS-like pages */
.sheet{background:var(--bg2);color:var(--ink)}
.shead{background:rgba(245,244,250,.85);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.ov.page .shead{border-bottom:1px solid var(--line)}
.sheet h2{font-size:28px;letter-spacing:-.02em}
.tile,.ach,.it{background:var(--card);border:0;box-shadow:0 1px 2px rgba(20,10,60,.06),0 6px 18px rgba(20,10,60,.05)}
.it{transition:transform .3s var(--spring),box-shadow .2s}
.it:active{transform:scale(.95)}
.it.sel{box-shadow:0 0 0 2.5px #3b2a9c,0 8px 20px rgba(59,42,156,.2)}
.ach .ic{background:var(--bg2)}
.tabs button{background:var(--card);box-shadow:0 1px 2px rgba(20,10,60,.08)}
.sheet .toggle{background:var(--card);box-shadow:0 1px 2px rgba(20,10,60,.06)}
.sheet .seg{background:#e9e7f3}
.field input{background:var(--card);border-color:#e4e1f2}
#pv{border-radius:22px;box-shadow:0 10px 30px rgba(40,20,140,.25)}
.buybar{background:linear-gradient(rgba(245,244,250,0),var(--bg2) 30%)}
#tabbar{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--line);box-shadow:none}
#tabbar button{transition:background .25s,color .25s}
#tabbar button.on b{transition:transform .4s var(--spring)}
/* game-over sheet slides up like an iOS card */
#over .sheet{border-radius:30px;animation:rise .55s var(--spring) both}
#over.hide .sheet{animation:none}
.win{letter-spacing:-.02em}
.toast{background:rgba(29,22,64,.88);border:1px solid rgba(255,210,63,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:18px}
.rb{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tut{border-radius:22px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}

/* ===== glass text layer (in-game) ===== */
#fxl{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.fxw{position:absolute;inset:0}.fxw.flip{transform:rotate(180deg)}
.gl{position:absolute;left:50%;transform:translate(-50%,-50%);white-space:nowrap;padding:.45em 1.05em .5em;border-radius:999px;font-weight:800;color:#fff;letter-spacing:-.01em;

<div id="shop" class="ov page hide"><div class="sheet">
  <div class="shead"><h2 data-t="shop_title"></h2><span class="coinpill" id="sCoins"></span><button class="x" data-close>✕</button></div>
  <canvas id="pv"></canvas>
  <div class="tabs" id="sTabs" style="margin-top:10px"></div>
  <div class="grid" id="sGrid"></div>
  <div class="buybar" id="buyBar"></div>

<div id="stats" class="ov page hide"><div class="sheet">
  <div class="shead"><h2 data-t="stats_title"></h2><button class="x" data-close>✕</button></div>
  <button class="btn b1 sm" id="toLb" data-t="open_lb"></button>

  <div class="sec" id="achHead"></div>
  <div class="achs" id="achs"></div>
</div></div>

<div id="moves" class="ov page hide"><div class="sheet">
  <div class="shead"><h2 data-t="mv_title"></h2><button class="x" data-close>✕</button></div>
  <button class="btn by sm" id="mvGuide"></button>

  <div class="sec" data-t="mv_fin_head"></div>

  <div class="sec" data-t="mv_combo_head"></div>

<div id="lb" class="ov page hide"><div class="sheet">
  <div class="shead"><h2 data-t="lb_title"></h2><button class="x" data-close>✕</button></div>

<div id="settings" class="ov page hide"><div class="sheet">
  <div class="shead"><h2 data-t="set_title"></h2><button class="x" data-close>✕</button></div>
  <label class="field"><span data-t="set_name"></span><input id="nameIn" maxlength="16" autocomplete="off"></label>
  <div id="langSeg" hidden></div>
  <button class="toggle" id="sndTog"><span data-t="set_sound"></span><span class="sw"></span></button>
  <div id="swipeSeg" hidden></div>
  <div class="lbl" data-t="ann_mode"></div>
  <div class="seg" id="annSeg"><button data-a="off"></button><button data-a="fx"></button><button data-a="he"></button><button data-a="en"></button></div>
  <p class="note" style="margin-top:2px" data-t="ann_d"></p>
  <button class="toggle" id="vibTog"><span data-t="set_vibe"></span><span class="sw"></span></button>
  <button class="danger" id="resetBtn" data-t="set_reset"></button>
</div></div>

<div id="pre" class="ov dim hide"><div class="sheet">
  <div class="shead"><h2 data-t="pre_title"></h2><button class="x" data-close>✕</button></div>

<div id="chal" class="ov dim hide"><div class="sheet" style="text-align:center">

  <button class="btn b2" id="chGo" data-t="ch_go"></button>
  <button class="btn bw sm" id="chNo" data-t="ch_no"></button>
</div></div>

<div id="guide" class="ov dim hide"><div class="gsheet">

</div></div>

  </div>
  <div id="onJoin" class="hide">
